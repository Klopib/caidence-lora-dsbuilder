name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: PowerShell lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        uses: actions/cache@v6
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pester5-pssa

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          foreach ($m in 'Pester', 'PSScriptAnalyzer') {
            if (-not (Get-Module -ListAvailable $m)) {
              Install-Module $m -Scope CurrentUser -Force -SkipPublisherCheck
            }
          }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($findings) {
            $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          Write-Host 'PSScriptAnalyzer clean.'

      - name: Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testresults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: testresults.xml

  python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Compile check
        run: python -m compileall -q review_ui.py lib/prepare_images.py

      - name: Ruff
        run: ruff check review_ui.py lib/prepare_images.py

  docker:
    name: App image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The published image is the only use of Docker in this project, so the
      # one thing worth checking is that it still builds.
      - name: Build app image
        run: docker build -t caidence-lora-dsbuilder:ci .

      - name: Smoke test the image
        run: |
          docker run --rm caidence-lora-dsbuilder:ci -NoProfile -Command             'python3 -c "import PIL, gradio; print(\"imaging and UI deps present\")"'
